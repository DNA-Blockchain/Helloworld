name: release

# Only tags pointing at code already merged into the default branch may release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches VERSION and is on the default branch
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION ($FILE)"; exit 1
          fi

          DEFAULT_BRANCH="$(git ls-remote --symref origin HEAD | awk '$1 == "ref:" { sub("refs/heads/", "", $2); print $2; exit }')"
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "Could not determine the repository default branch"; exit 1
          fi
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "Tagged commit is not reachable from the default branch ($DEFAULT_BRANCH)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm tag is still on the default branch
        run: |
          DEFAULT_BRANCH="$(git ls-remote --symref origin HEAD | awk '$1 == "ref:" { sub("refs/heads/", "", $2); print $2; exit }')"
          if [ -z "$DEFAULT_BRANCH" ]; then
            echo "Could not determine the repository default branch"; exit 1
          fi
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "Tagged commit is not reachable from the default branch ($DEFAULT_BRANCH)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install before exposing the model-publishing credential.
      - name: Install publisher dependency
        run: pip install "huggingface_hub>=1.0"

      - name: Publish the model versions this release ships (Hugging Face)
        # Configure HF_TOKEN as a secret on the protected release-publish environment, not a repository secret.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy/hf_publish.py promote --release "$GITHUB_REF_NAME"

      - name: Code manifest (authorship and the SHA-256 of every file)
        run: |
          MANIFEST="rabbitsoftware-${GITHUB_REF_NAME#v}-code-manifest.json"
          python scripts/code_fingerprint.py --commit HEAD --out "$MANIFEST"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > release-notes.md
          FINGERPRINT=$(python -c "import json; print(json.load(open('$MANIFEST'))['fingerprint'])")
          python deploy/hf_publish.py notes --release "$GITHUB_REF_NAME" > model-notes.md
          if [ -s model-notes.md ]; then printf '\n\n### Model\n' >> release-notes.md; cat model-notes.md >> release-notes.md; fi
          printf '\n\n---\n**Code fingerprint:** `%s`. The attached `%s` lists the SHA-256 of every file. Check it with `python scripts/code_fingerprint.py --commit %s`. Authorship: see NOTICE.md.\n' "$FINGERPRINT" "$MANIFEST" "$GITHUB_REF_NAME" >> release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$MANIFEST" --title "RabbitSoftware ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag